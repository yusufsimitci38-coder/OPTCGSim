# Downloads every English card image (via the punk-records card list) and publishes them as WebP
# files on the `card-images` branch, at en/<card id>.webp. Only new cards are fetched on reruns.
name: Card images

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC; new sets show up in punk-records within a day
  push:
    paths:
      - scripts/download-card-images.ts
      - .github/workflows/card-images.yml

permissions:
  contents: write

concurrency:
  group: card-images
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Get the card list
        run: git clone --depth 1 https://github.com/buhbbl/punk-records "$RUNNER_TEMP/punk-records"

      - name: Get previously downloaded images
        env:
          REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if git ls-remote --exit-code "$REMOTE" card-images >/dev/null; then
            git clone --depth 1 --branch card-images --single-branch "$REMOTE" "$RUNNER_TEMP/images"
          else
            git init -b card-images "$RUNNER_TEMP/images"
            git -C "$RUNNER_TEMP/images" remote add origin "$REMOTE"
          fi

      - name: Download new images
        run: node scripts/download-card-images.ts "$RUNNER_TEMP/punk-records/english" "$RUNNER_TEMP/images/en"

      - name: Publish to the card-images branch
        working-directory: ${{ runner.temp }}/images
        run: |
          cat > README.md <<'README'
          # Card images

          Generated by `.github/workflows/card-images.yml` on the main branch. Do not edit by hand.

          `en/<card id>.webp` for every English printing (alternate arts keep their suffix, e.g.
          `OP01-016_p3`), 400px wide. `en/manifest.json` lists the ids.

          Card images © Eiichiro Oda / Shueisha / Bandai, from the official card list at
          https://en.onepiece-cardgame.com/cardlist/. Used for a non-commercial fan simulator.
          README
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new images."
            exit 0
          fi
          # Keep a single commit so the branch doesn't accumulate history; unchanged files reuse
          # the blobs already on GitHub, so only new images are uploaded.
          if git rev-parse -q --verify HEAD >/dev/null; then
            git commit -q --amend -m "Card images ($(jq .count en/manifest.json) printings)"
          else
            git commit -q -m "Card images ($(jq .count en/manifest.json) printings)"
          fi
          git push --force origin card-images
