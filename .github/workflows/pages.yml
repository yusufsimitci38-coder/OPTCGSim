# Builds the app and publishes it on GitHub Pages, where every card image can load.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: Publish site

on:
  workflow_dispatch:
  push:
    branches: [ccr-4f232bbd-cemz62]
    paths-ignore:
      - "**.md"
      - .github/workflows/card-images.yml
      - .github/workflows/official-extras.yml
      - scripts/**

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
